<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>図書館蔵書チェッカー - 設定</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div id="app">
    <header class="page-header">
      <h1>📚 図書館蔵書チェッカー 設定</h1>
    </header>

    <main class="page-body">

      <!-- APIキー設定 -->
      <section class="card">
        <h2>カーリルAPIキー</h2>
        <p class="description">
          <a href="https://calil.jp/doc/api.html" target="_blank" rel="noopener noreferrer">カーリル</a>
          で取得したアプリケーションキーを入力してください。
        </p>
        <div class="form-row">
          <input type="text" id="api-key-input" placeholder="APIキーを入力" autocomplete="off" spellcheck="false">
          <button id="save-api-key-btn" class="btn btn-primary">保存</button>
        </div>
        <p id="api-key-status" class="status-message hidden"></p>
      </section>

      <!-- 図書館検索 -->
      <section class="card">
        <h2>図書館を検索・追加</h2>
        <p class="description">都道府県（必須）と市区町村名（任意）で図書館を検索できます。</p>

        <div class="search-form">
          <div class="form-row">
            <select id="pref-select">
              <option value="">都道府県を選択</option>
              <option value="北海道">北海道</option>
              <option value="青森県">青森県</option>
              <option value="岩手県">岩手県</option>
              <option value="宮城県">宮城県</option>
              <option value="秋田県">秋田県</option>
              <option value="山形県">山形県</option>
              <option value="福島県">福島県</option>
              <option value="茨城県">茨城県</option>
              <option value="栃木県">栃木県</option>
              <option value="群馬県">群馬県</option>
              <option value="埼玉県">埼玉県</option>
              <option value="千葉県">千葉県</option>
              <option value="東京都">東京都</option>
              <option value="神奈川県">神奈川県</option>
              <option value="新潟県">新潟県</option>
              <option value="富山県">富山県</option>
              <option value="石川県">石川県</option>
              <option value="福井県">福井県</option>
              <option value="山梨県">山梨県</option>
              <option value="長野県">長野県</option>
              <option value="岐阜県">岐阜県</option>
              <option value="静岡県">静岡県</option>
              <option value="愛知県">愛知県</option>
              <option value="三重県">三重県</option>
              <option value="滋賀県">滋賀県</option>
              <option value="京都府">京都府</option>
              <option value="大阪府">大阪府</option>
              <option value="兵庫県">兵庫県</option>
              <option value="奈良県">奈良県</option>
              <option value="和歌山県">和歌山県</option>
              <option value="鳥取県">鳥取県</option>
              <option value="島根県">島根県</option>
              <option value="岡山県">岡山県</option>
              <option value="広島県">広島県</option>
              <option value="山口県">山口県</option>
              <option value="徳島県">徳島県</option>
              <option value="香川県">香川県</option>
              <option value="愛媛県">愛媛県</option>
              <option value="高知県">高知県</option>
              <option value="福岡県">福岡県</option>
              <option value="佐賀県">佐賀県</option>
              <option value="長崎県">長崎県</option>
              <option value="熊本県">熊本県</option>
              <option value="大分県">大分県</option>
              <option value="宮崎県">宮崎県</option>
              <option value="鹿児島県">鹿児島県</option>
              <option value="沖縄県">沖縄県</option>
            </select>
            <input type="text" id="city-input" placeholder="市区町村名（任意）">
            <button id="search-btn" class="btn btn-secondary">検索</button>
          </div>
        </div>

        <div id="search-loading" class="loading-row hidden">
          <div class="spinner"></div>
          <span>検索中...</span>
        </div>
        <p id="search-error" class="error-text hidden"></p>

        <div id="search-results" class="search-results hidden">
          <p class="results-count"></p>
          <div id="search-results-list" class="library-list"></div>
        </div>
      </section>

      <!-- 選択中の図書館 -->
      <section class="card">
        <h2>選択中の図書館 <span class="count-badge" id="selected-count">0</span> / 5</h2>
        <p class="description">最大5館まで設定できます。</p>
        <div id="selected-libraries" class="library-list">
          <p class="empty-message">図書館が設定されていません</p>
        </div>
        <button id="save-libraries-btn" class="btn btn-primary" style="margin-top: 12px;">保存</button>
        <p id="save-status" class="status-message hidden"></p>
      </section>

    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
